<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Video MP4 v7.6</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#eef4fd;color:#132443}
header{background:#071737;padding:24px 16px;display:flex;gap:10px;position:sticky;top:0}
input{flex:1;font-size:18px;padding:16px;border:0;border-radius:16px}button,a.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;text-decoration:none;display:inline-block}
.primary{background:#1747a5;color:#fff}.secondary{background:#e9edf4;color:#142443}
main{padding:18px;max-width:760px;margin:auto}.notice,.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0}.notice{background:#fff3e4;color:#963b18}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs button{margin:0}.status{padding:14px;border-radius:14px;background:#edf3fb;margin:14px 0;font-weight:650;white-space:pre-wrap}
.item{padding:18px 0;border-top:1px solid #dbe3ef}.item h3{margin:0 0 8px}.meta{color:#657592;margin-bottom:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}
.progress{height:10px;background:#dfe6ef;border-radius:10px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#1747a5;width:0}
small{color:#64748b}
</style>
</head>
<body>
<header><input id="q" placeholder="動画を検索…"><button class="primary" onclick="searchCommons()">検索</button></header>
<main>
<div class="notice"><b>Video MP4 v7.6</b><br>iPhoneで変換が止まり続けないよう、取得・変換を分離し、タイムアウトと進捗表示を追加しました。</div>
<div class="tabs"><button class="primary">Commons検索</button><button class="secondary" onclick="document.getElementById('local').click()">手元の動画</button></div>
<input id="local" type="file" accept="video/*,.webm" hidden onchange="localPicked(this.files[0])">
<div class="card">
<h2>Wikimedia Commons動画検索</h2>
<div id="status" class="status">検索語を入力してください。</div>
<div id="progress" class="progress" hidden><div id="bar" class="bar"></div></div>
<div id="results"></div>
</div>
<small>DRM解除・アクセス制限回避・提供元が禁止するダウンロードには対応しません。保存・変換は権利上許可された動画だけに使用してください。</small>
</main>
<script>
const $=id=>document.getElementById(id);
function setStatus(s){$('status').textContent=s}
function prog(n){$('progress').hidden=false;$('bar').style.width=n+'%'}
function timeout(ms,msg){return new Promise((_,r)=>setTimeout(()=>r(new Error(msg)),ms))}
async function fetchTimed(url,ms=20000){
 const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
 try{return await fetch(url,{signal:c.signal,mode:'cors'})}finally{clearTimeout(t)}
}
async function searchCommons(){
 let q=$('q').value.trim(); if(!q){setStatus('検索語を入力してください。');return}
 setStatus('検索中…'); $('results').innerHTML='';
 const api='https://commons.wikimedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch='+encodeURIComponent('filetype:video '+q)+'&gsrnamespace=6&gsrlimit=20&prop=imageinfo&iiprop=url|mime|size|extmetadata&format=json';
 try{
  let r=await fetchTimed(api,15000); if(!r.ok)throw Error('検索通信エラー');
  let d=await r.json(), pages=Object.values(d.query?.pages||{}).filter(x=>x.imageinfo?.[0]?.url);
  setStatus(pages.length+'件見つかりました。保存前にライセンスを確認してください。');
  for(const p of pages){
   let i=p.imageinfo[0], lic=(i.extmetadata?.LicenseShortName?.value||'要確認').replace(/<[^>]*>/g,'');
   let div=document.createElement('div'); div.className='item';
   div.innerHTML='<h3>'+esc(p.title.replace(/^File:/,''))+'</h3><div class="meta">'+esc(i.mime||'')+' ・ '+fmt(i.size)+' ・ ライセンス: '+esc(lic)+'</div><div class="actions"><a class="btn secondary" target="_blank" href="https://commons.wikimedia.org/wiki/'+encodeURIComponent(p.title)+'">詳細・ライセンス</a><button class="primary">保存→MP4</button><a class="btn secondary" target="_blank" href="'+escAttr(i.url)+'">元動画を開く</a></div>';
   div.querySelector('button').onclick=()=>handle(i.url,p.title);
   $('results').appendChild(div);
  }
 }catch(e){setStatus('検索エラー: '+e.message)}
}
async function handle(url,title){
 prog(5); setStatus('① 元動画を取得中…（最大20秒）');
 try{
  let r=await fetchTimed(url,20000); if(!r.ok)throw Error('HTTP '+r.status);
  prog(30); let b=await r.blob(); setStatus('② 元動画を取得しました ('+fmt(b.size)+')\nMP4変換を開始します。最大90秒で停止します。');
  await convertBlob(b,title.replace(/^File:/,''));
 }catch(e){
  $('progress').hidden=true;
  setStatus('直接取得できませんでした／時間切れです。\n「元動画を開く」から提供元の許可された保存方法を利用してください。\n理由: '+e.message);
 }
}
async function loadFF(){
 if(window.FFmpegWASM) return;
 setStatus('変換エンジンを読み込み中…');
 await Promise.race([
  import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/+esm').then(m=>window.FFmpegWASM=m),
  timeout(20000,'変換エンジンの読込が20秒で時間切れ')
 ]);
}
async function convertBlob(blob,name){
 try{
  prog(35); await loadFF(); const {FFmpeg}=window.FFmpegWASM; const ff=new FFmpeg();
  ff.on('progress',({progress})=>{let n=40+Math.max(0,Math.min(1,progress))*55;prog(n);setStatus('③ MP4へ変換中… '+Math.round(progress*100)+'%')});
  await Promise.race([ff.load(),timeout(25000,'変換エンジン起動が25秒で時間切れ')]);
  let arr=new Uint8Array(await blob.arrayBuffer()); await ff.writeFile('input.webm',arr);
  await Promise.race([ff.exec(['-i','input.webm','-c:v','libx264','-preset','ultrafast','-c:a','aac','-movflags','faststart','output.mp4']),timeout(90000,'MP4変換が90秒で時間切れ')]);
  let out=await ff.readFile('output.mp4'); prog(100);
  let u=URL.createObjectURL(new Blob([out.buffer],{type:'video/mp4'})); let a=document.createElement('a');a.href=u;a.download=name.replace(/\.[^.]+$/,'')+'.mp4';a.click();
  setStatus('完了しました。MP4の保存画面を確認してください。');
  setTimeout(()=>URL.revokeObjectURL(u),30000);
 }catch(e){$('progress').hidden=true;setStatus('変換を停止しました。\n'+e.message+'\n※1分以上待ち続けることはありません。')}
}
function localPicked(f){if(!f)return;setStatus('手元の動画: '+f.name+' ('+fmt(f.size)+')');convertBlob(f,f.name)}
function fmt(n){if(n==null)return'';return n>1048576?(n/1048576).toFixed(1)+' MB':(n/1024).toFixed(0)+' KB'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return esc(s)}
</script></body></html>

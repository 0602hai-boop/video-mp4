<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Video MP4"><link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<title>Video MP4</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#0f172a;background:#f1f5f9}
*{box-sizing:border-box}body{margin:0}header{background:#0f172a;color:#fff;padding:18px 16px calc(18px + env(safe-area-inset-top));position:sticky;top:0;z-index:10}
h1{font-size:23px;margin:0 0 12px}.search{display:flex;gap:8px}.search input{min-width:0;flex:1;border:0;border-radius:12px;padding:13px;font-size:16px}.search button{border:0;border-radius:12px;padding:0 17px;font-weight:700}
main{max-width:760px;margin:auto;padding:14px 14px 40px}.panel{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 10px #0000000b}
.tabs{display:flex;gap:7px}.tab{flex:1;border:0;border-radius:10px;padding:11px;font-weight:700;background:#e2e8f0}.tab.active{background:#0f172a;color:#fff}
.item{padding:14px 0;border-top:1px solid #e2e8f0}.item:first-child{border-top:0}.title{font-weight:750;line-height:1.4}.meta{font-size:12px;color:#64748b;margin-top:5px}.badge{display:inline-block;margin:7px 0 3px;padding:4px 8px;border-radius:7px;background:#dcfce7;color:#166534;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;background:#0f172a;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}
.small{font-size:13px;color:#64748b;line-height:1.65}.ok{color:#166534;font-weight:700}.hidden{display:none}
progress{width:100%;height:10px;margin-top:8px}
.filebox{border:2px dashed #94a3b8;border-radius:13px;padding:16px;text-align:center}.filebox input{width:100%;font-size:15px}
</style>
<style>
.appnote{background:#e0f2fe;color:#075985;border-radius:13px;padding:12px;margin:10px 0;font-size:13px;line-height:1.55}
.install{background:#fff7ed;color:#9a3412}
</style></head>
<body>
<header>
<h1>🎬 Video MP4</h1>
<form class="search" id="searchForm"><input id="query" placeholder="動画を検索…" autocomplete="off"><button>検索</button></form>
</header>
<main>
<div class="appnote install"><b>📱 アプリとして使う</b><br>Safariでこのページを開き、共有ボタン →「ホーム画面に追加」で、ホーム画面から単独起動できます。</div>
<div class="panel">
<div class="tabs"><button class="tab active" id="tabSearch">動画検索</button><button class="tab" id="tabConvert">手元の動画</button><button class="tab" id="tabHistory">履歴</button></div>
</div>

<section id="searchView">
<div class="panel small"><b>安全な検索</b><br>Wikimedia Commonsを検索します。保存する前に、各ファイルの詳細ページでライセンス条件を確認してください。</div>
<div id="status" class="small">検索語を入力してください。</div><div id="results"></div>
</section>

<section id="convertView" class="hidden">
<div class="panel"><b>手元の動画をMP4へ</b><p class="small">動画をiPhone上で処理します。サーバーへアップロードしません。</p>
<div class="filebox"><input id="localFile" type="file" accept="video/*"></div>
<div class="actions"><button id="convertBtn" disabled>MP4に変換</button><button class="secondary" id="resetBtn">クリア</button></div>
<progress id="progress" value="0" max="100" hidden></progress><div id="convertMsg" class="small"></div></div>
</section>

<section id="historyView" class="hidden">
<div class="panel"><b>保存履歴</b><div id="history" class="small">まだありません。</div><div class="actions"><button class="danger" id="clearHistory">履歴を消去</button></div></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s), API='https://commons.wikimedia.org/w/api.php';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safe(s){return String(s).replace(/[\\/:*?"<>|]/g,'_').slice(0,100)}
function saveFile(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000)}
function addHistory(name){let a=JSON.parse(localStorage.vmp4||'[]');a.unshift({name,time:new Date().toLocaleString('ja-JP')});localStorage.vmp4=JSON.stringify(a.slice(0,30));renderHistory()}
function renderHistory(){let a=JSON.parse(localStorage.vmp4||'[]');$('#history').innerHTML=a.length?a.map(x=>`<div class="item">✓ ${esc(x.name)}<br><span>${esc(x.time)}</span></div>`).join(''):'まだありません。'}
renderHistory();

function show(view){['searchView','convertView','historyView'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==view));['tabSearch','tabConvert','tabHistory'].forEach(x=>$('#'+x).classList.remove('active'));$('#'+({searchView:'tabSearch',convertView:'tabConvert',historyView:'tabHistory'}[view])).classList.add('active')}
$('#tabSearch').onclick=()=>show('searchView');$('#tabConvert').onclick=()=>show('convertView');$('#tabHistory').onclick=()=>show('historyView');
$('#clearHistory').onclick=()=>{localStorage.removeItem('vmp4');renderHistory()};

$('#searchForm').onsubmit=async e=>{
e.preventDefault();let q=$('#query').value.trim();if(!q)return;
$('#status').textContent='検索中…';$('#results').innerHTML='';
try{
let u=new URL(API);[['action','query'],['generator','search'],['gsrsearch',q+' filetype:video'],['gsrnamespace','6'],['gsrlimit','15'],['prop','imageinfo|info'],['iiprop','url|mime|size'],['inprop','url'],['format','json'],['origin','*']].forEach(([k,v])=>u.searchParams.set(k,v));
let d=await fetch(u).then(r=>r.json()),pages=Object.values(d.query?.pages||{});
if(!pages.length){$('#status').textContent='動画が見つかりませんでした。';return}
$('#status').textContent=pages.length+'件。保存前にライセンスを確認してください。';
for(let p of pages){
let ii=p.imageinfo?.[0];if(!ii?.url)continue;let title=(p.title||'').replace(/^File:/,''),page='https://commons.wikimedia.org/wiki/'+encodeURIComponent((p.title||'').replace(/ /g,'_'));
let el=document.createElement('div');el.className='item';
el.innerHTML=`<div class="title">${esc(title)}</div><span class="badge">ライセンス確認</span><div class="meta">${esc(ii.mime||'不明')}　${ii.size?Math.round(ii.size/1048576*10)/10+' MB':''}</div><div class="actions"><a href="${page}" target="_blank" rel="noopener"><button type="button" class="secondary">詳細・ライセンス</button></a><button type="button" data-save>保存→MP4</button></div><div class="small" data-msg></div>`;
$('#results').appendChild(el);el.querySelector('[data-save]').onclick=()=>fetchAndConvert(ii.url,title,el.querySelector('[data-msg']));
}
}catch(e){$('#status').textContent='検索できませんでした。通信状態を確認してください。'}
};

async function fetchAndConvert(url,title,msg){
try{
msg.textContent='動画を取得中…';let r=await fetch(url);if(!r.ok)throw Error('取得できません');
let blob=await r.blob(),name=safe(title)+'.mp4';
if(blob.type.includes('mp4')){saveFile(blob,name);addHistory(name);msg.innerHTML='<span class="ok">✓ MP4を保存しました</span>';return}
msg.textContent='MP4へ変換中…';
const {FFmpeg}=await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js');
const {fetchFile,toBlobURL}=await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js');
const ff=new FFmpeg();ff.on('progress',x=>msg.textContent='MP4変換中… '+Math.round(x.progress*100)+'%');
const b='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';
await ff.load({coreURL:await toBlobURL(b+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(b+'/ffmpeg-core.wasm','application/wasm')});
await ff.writeFile('input',await fetchFile(blob));
await ff.exec(['-i','input','-c:v','libx264','-preset','veryfast','-crf','23','-c:a','aac','-b:a','128k','-movflags','+faststart','output.mp4']);
let out=await ff.readFile('output.mp4');saveFile(new Blob([out.buffer],{type:'video/mp4'}),name);addHistory(name);msg.innerHTML='<span class="ok">✓ 変換・保存完了</span>';
}catch(e){msg.textContent='保存/変換できませんでした。大容量動画や未対応形式の可能性があります。'}
}

let localFile=null;$('#localFile').onchange=()=>{$('#convertBtn').disabled=!$('#localFile').files?.length;localFile=$('#localFile').files?.[0]||null};
$('#resetBtn').onclick=()=>{$('#localFile').value='';localFile=null;$('#convertBtn').disabled=true;$('#progress').hidden=true;$('#convertMsg').textContent=''};
$('#convertBtn').onclick=async()=>{
if(!localFile)return;$('#convertBtn').disabled=true;$('#progress').hidden=false;$('#convertMsg').textContent='変換エンジンを読み込んでいます…';
try{
const {FFmpeg}=await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js');const {fetchFile,toBlobURL}=await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js');const ff=new FFmpeg();ff.on('progress',x=>{$('#progress').value=x.progress*100;$('#convertMsg').textContent='変換中… '+Math.round(x.progress*100)+'%'});
const b='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';await ff.load({coreURL:await toBlobURL(b+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(b+'/ffmpeg-core.wasm','application/wasm')});
await ff.writeFile('input',await fetchFile(localFile));await ff.exec(['-i','input','-c:v','libx264','-preset','veryfast','-crf','23','-c:a','aac','-b:a','128k','-movflags','+faststart','output.mp4']);let d=await ff.readFile('output.mp4'),name=safe(localFile.name.replace(/\.[^.]+$/,''))+'.mp4';saveFile(new Blob([d.buffer],{type:'video/mp4'}),name);addHistory(name);$('#convertMsg').innerHTML='<span class="ok">✓ 変換・保存完了</span>';
}catch(e){$('#convertMsg').textContent='変換できませんでした。動画形式・容量・iPhoneのメモリを確認してください.'}
finally{$('#convertBtn').disabled=!localFile}
};
</script></body></html>

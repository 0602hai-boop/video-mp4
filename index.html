<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071536">
<link rel="manifest" href="manifest.webmanifest">
<title>Video MP4 v7.7</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf4fd;color:#102347;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:650}
header{position:sticky;top:0;z-index:3;background:#071536;padding:22px 16px;display:flex;gap:10px}
input{flex:1;border:0;border-radius:18px;padding:18px;font-size:18px}button,a.btn{border:0;border-radius:18px;padding:16px 20px;font-size:17px;font-weight:800;text-decoration:none;display:inline-block}
.primary{background:#2452b8;color:white}.secondary{background:#e7ebf2;color:#102347}
main{padding:28px 16px;max-width:820px;margin:auto}.notice,.card{background:white;border-radius:28px;padding:24px;margin-bottom:20px}
.notice{background:#fff3e3;color:#8b3518}.tabs{display:flex;gap:12px;margin:18px 0}.tabs button{flex:1}
.status{background:#eef3fa;border-radius:18px;padding:16px;margin:14px 0}.item{padding:22px 0;border-top:1px solid #d6dfec}.item h3{font-size:22px;margin:0 0 10px}.meta{color:#667793;margin-bottom:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}
.small{font-size:14px;color:#65758f;line-height:1.55}
</style>
</head>
<body>
<header><input id="q" placeholder="動画を検索…"><button class="primary" id="search">検索</button></header>
<main>
<div class="notice"><b>Video MP4 v7.7</b><br>iPhone内の変換エンジンは使いません。Wikimediaが提供するMP4版がある場合は、そのMP4を直接開いて保存します。</div>
<div class="tabs"><button class="primary">Commons検索</button><button class="secondary" id="local">手元の動画</button></div>
<section class="card">
<h2>Wikimedia Commons動画検索</h2>
<div id="status" class="status">検索語を入力してください。</div>
<div id="results"></div>
</section>
<p class="small">DRM解除・アクセス制限回避・提供元が禁止するダウンロードには対応しません。保存はライセンスと提供元の条件を確認して行ってください。MP4版がない場合は元動画を開きます。</p>
</main>
<script>
const $=s=>document.querySelector(s), status=$('#status'), results=$('#results');
$('#search').onclick=search; $('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('#local').onclick=()=>{status.textContent='v7.7ではブラウザ内変換を停止しています。iPhoneの「ファイル」等でMP4動画を扱ってください。'};
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function search(){
 const q=$('#q').value.trim(); if(!q){status.textContent='検索語を入力してください。';return}
 status.textContent='検索中…'; results.innerHTML='';
 try{
  const u='https://commons.wikimedia.org/w/api.php?origin=*&action=query&generator=search&gsrnamespace=6&gsrsearch='+encodeURIComponent(q+' filetype:video')+'&gsrlimit=20&prop=imageinfo&iiprop=url|mime|size|extmetadata&iiurlwidth=640&format=json';
  const j=await fetch(u).then(r=>r.json()); const pages=Object.values(j.query?.pages||{}).filter(p=>p.imageinfo?.[0]);
  status.textContent=pages.length+'件見つかりました。MP4版があれば「MP4を開く」が表示されます。';
  for(const p of pages) render(p);
 }catch(e){status.textContent='通信エラーです。時間をおいて再検索してください。'}
}
function license(ii){const m=ii.extmetadata||{};return m.LicenseShortName?.value||m.UsageTerms?.value||'要確認'}
async function render(p){
 const ii=p.imageinfo[0], title=p.title.replace(/^File:/,''), mb=(ii.size/1048576).toFixed(1);
 const d=document.createElement('div'); d.className='item';
 d.innerHTML='<h3>'+esc(title)+'</h3><div class="meta">'+esc(ii.mime||'')+' ・ '+mb+' MB ・ ライセンス: '+esc(license(ii).replace(/<[^>]*>/g,''))+'</div><div class="actions"><a class="btn secondary" target="_blank" href="'+esc(ii.descriptionurl)+'">詳細・ライセンス</a><button class="primary mp4">MP4を探す</button><a class="btn secondary" target="_blank" href="'+esc(ii.url)+'">元動画を開く</a></div><div class="small msg"></div>';
 results.appendChild(d);
 d.querySelector('.mp4').onclick=()=>findMp4(p.title,d.querySelector('.msg'),d.querySelector('.mp4'));
}
async function findMp4(fileTitle,msg,btn){
 btn.disabled=true; msg.textContent='WikimediaのMP4派生版を確認中…';
 try{
   const api='https://commons.wikimedia.org/w/api.php?origin=*&action=query&titles='+encodeURIComponent(fileTitle)+'&prop=videoinfo&viprop=derivatives&format=json';
   const j=await fetch(api).then(r=>r.json()), pg=Object.values(j.query?.pages||{})[0];
   const ds=pg?.videoinfo?.[0]?.derivatives||[];
   const mp4s=ds.filter(x=>(x.type||'').includes('mp4') || /\.mp4(?:\?|$)/i.test(x.src||''));
   if(mp4s.length){
     mp4s.sort((a,b)=>(a.width||0)-(b.width||0));
     const x=mp4s[mp4s.length-1];
     msg.innerHTML='MP4版が見つかりました（'+(x.width||'?')+'×'+(x.height||'?')+'）。 <a class="btn primary" target="_blank" href="'+esc(x.src)+'">MP4を開く</a>';
   } else msg.textContent='MP4派生版は見つかりませんでした。「元動画を開く」を使ってください。';
 }catch(e){msg.textContent='MP4版の確認に失敗しました。';}
 btn.disabled=false;
}
</script></body></html>
